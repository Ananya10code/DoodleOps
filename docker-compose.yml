name: doodleops

services:
  mysqldb:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-whiteboard_db}   # auto-created on first start
      MYSQL_USER: ${MYSQL_USER:-doodleops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-app}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [doodleops-net]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysqldb:
        condition: service_healthy
    environment:
      DB_HOST: mysqldb
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-whiteboard_db}
      DB_USER: ${MYSQL_USER:-doodleops}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change-me-app}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    expose:
      - "8080"            # reachable only through the frontend's nginx proxy
    networks: [doodleops-net]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks: [doodleops-net]

networks:
  doodleops-net:
    driver: bridge

volumes:
  mysql_data:
